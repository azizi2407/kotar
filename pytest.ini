[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    error
# `integration` işaretli testler GERÇEK dış servisi çağırır (Codex CLI → ChatGPT kotası,
# 1-4 dk) → varsayılan turda koşmaz. Elle çalıştırmak için:
#   venv/bin/python -m pytest tests/test_codex_image_integration.py -m integration -q
markers =
    integration: gerçek dış servis çağırır; varsayılan turda atlanır
addopts = -m "not integration"
