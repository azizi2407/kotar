[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    error
# Tests marked `integration` call a REAL external service (Codex CLI → ChatGPT quota,
# 1-4 min) → not run in the default pass. To run manually:
#   venv/bin/python -m pytest tests/test_codex_image_integration.py -m integration -q
markers =
    integration: calls a real external service; skipped in the default pass
addopts = -m "not integration"
